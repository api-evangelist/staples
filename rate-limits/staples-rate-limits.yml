description: Staples Advantage eProcurement integrations are B2B partner-only. Rate limits, throttling response codes, and retry semantics are defined in the partner integration agreement and are not published on a public developer-docs page.
sources:
  - https://www.staplesadvantage.com/learn/eprocurement-integrations
notes: B2B / enterprise contract only. No public rate-limit documentation. Effective limits are set in the integration agreement and enforced at the Staples eProcurement gateway.
responseCodes:
  throttled: 429
limits:
  - name: Partner Contract Limit
    scope: partner-account
    metric: varies
    limit: per integration agreement; not publicly documented
    notes: Throughput, burst, and concurrency caps are defined per partner; consult the Staples Sales Engineer onboarding the integration for the binding numbers.
policies:
  - name: PunchOut Session Semantics
    description: cXML / OCI PunchOut traffic is session-based - the punch-out request opens a session, the cart is returned via PunchOutOrderMessage, and the bulk of throughput is request-pair, not high-RPS REST. Rate-limit posture differs from REST order-management traffic.
  - name: EDI Batch Cadence
    description: EDI flows are batched (typically 850/855/856/810 documents) and not subject to second-level rate limits in the same way as REST APIs. Cadence is agreed during onboarding.
  - name: Backoff
    description: Generic exponential backoff with jitter is recommended absent vendor-published Retry-After semantics; consult partner documentation for the exact response contract.
maintainers:
  - name: Staples Business Advantage
    url: https://www.staplesadvantage.com/
