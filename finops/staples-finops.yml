description: Staples Advantage eProcurement is a B2B procurement contract, not a per-call API product. Cost surfaces as the line items on the Staples Business Advantage invoice (purchased goods, shipping, applicable taxes), not as an API-usage meter. FinOps shape is procurement-spend tracking against the negotiated agreement; per-call API metering does not apply.
sources:
  - https://www.staplesadvantage.com/learn/eprocurement-integrations
notes: No API usage meter. FOCUS-style modeling here describes procurement spend (purchase orders, line items) rather than per-call API charges, since access is bundled into the procurement agreement.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Staples, Inc. (Staples Business Advantage)
serviceCategory: B2B Procurement
billingModel:
  pricingCategory: Procurement (Per-Order)
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Staples Advantage eProcurement
  ServiceCategory: B2B Procurement
  ProviderName: Staples
  PublisherName: Staples, Inc.
  InvoiceIssuerName: Staples, Inc.
  BillingCurrency: USD
meters:
  - name: purchase_order_value
    unit: USD
    aggregation: sum
    dimensions:
      - cost_center
      - department
      - punchout_session
  - name: purchase_order_lines
    unit: line
    aggregation: count
    dimensions:
      - sku_category
      - cost_center
principles:
  - name: Visibility
    description: Spend is visible through the Staples Business Advantage account dashboard and through the integrated procurement system (Ariba, Coupa, Jaggaer, Oracle, NetSuite). Pull cXML order responses or EDI 810 invoices into the procurement-analytics layer for line-level visibility.
  - name: Allocation
    description: Allocate spend by cost center / department through the procurement system's chart-of-accounts mapping. PunchOut sessions carry the requisitioner identity into Staples for downstream reporting.
  - name: Optimization
    description: Cost levers are catalog-side - enforce contract-priced SKU lists in the punch-out catalog, set per-requester approval thresholds, and consolidate orders to qualify for shipping / volume discounts negotiated in the master agreement.
  - name: Accountability
    description: Procurement / sourcing team owns the Staples Business Advantage agreement; department managers own their cost-center spend through the procurement system's approval flow.
maintainers:
  - name: Staples Business Advantage
    url: https://www.staplesadvantage.com/
