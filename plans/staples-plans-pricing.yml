description: Staples Advantage exposes its eProcurement integrations (PunchOut cXML/OCI, EDI, REST order management) only to enterprise B2B customers via a dedicated Sales Engineer onboarding. The staplesadvantage.com integrations page advertises 170+ supported procurement systems but does not publish API access fees, partner-tier pricing, or rate limits. There is no self-serve developer portal.
sources:
  - https://www.staplesadvantage.com/learn/eprocurement-integrations
  - https://www.staplesadvantage.com/
notes: B2B / enterprise contract only. No self-serve API pricing. Onboarding is sales-led; commercial terms (catalog access, integration fees, transaction discounts) are negotiated as part of the Staples Business Advantage purchasing agreement.
