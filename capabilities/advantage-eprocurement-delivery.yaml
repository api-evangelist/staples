naftiko: 1.0.0-alpha2
info:
  label: Staples Advantage eProcurement API — Delivery
  description: 'Staples Advantage eProcurement API — Delivery. 1 operations. Lead operation: Track Delivery. Self-contained
    Naftiko capability covering one Staples business surface.'
  tags:
  - Staples
  - Delivery
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STAPLES_API_KEY: STAPLES_API_KEY
capability:
  consumes:
  - type: http
    namespace: advantage-eprocurement-delivery
    baseUri: https://api.staplesadvantage.com
    description: Staples Advantage eProcurement API — Delivery business capability. Self-contained, no shared references.
    resources:
    - name: v1-delivery-tracking-trackingNumber
      path: /v1/delivery/tracking/{trackingNumber}
      operations:
      - name: trackdelivery
        method: GET
        description: Track Delivery
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: trackingNumber
          in: path
          type: string
          description: The carrier tracking number
          required: true
    authentication:
      type: bearer
      token: '{{env.STAPLES_API_KEY}}'
  exposes:
  - type: rest
    namespace: advantage-eprocurement-delivery-rest
    port: 8080
    description: REST adapter for Staples Advantage eProcurement API — Delivery. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/delivery/tracking/{trackingnumber}
      name: v1-delivery-tracking-trackingnumber
      description: REST surface for v1-delivery-tracking-trackingNumber.
      operations:
      - method: GET
        name: trackdelivery
        description: Track Delivery
        call: advantage-eprocurement-delivery.trackdelivery
        with:
          trackingNumber: rest.trackingNumber
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: advantage-eprocurement-delivery-mcp
    port: 9090
    transport: http
    description: MCP adapter for Staples Advantage eProcurement API — Delivery. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: track-delivery
      description: Track Delivery
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: advantage-eprocurement-delivery.trackdelivery
      with:
        trackingNumber: tools.trackingNumber
      outputParameters:
      - type: object
        mapping: $.
