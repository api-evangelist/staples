naftiko: "1.0.0-alpha1"

info:
  label: "Staples Advantage eProcurement API"
  description: >-
    Staples Advantage B2B eProcurement API for enterprise office supply procurement. Enables partner procurement systems to search the product catalog, manage orders, track deliveries, and access account and invoice data. Integrates with over 170 eProcurement platforms.
  tags:
    - Staples
    - eProcurement
    - Office Supplies
    - B2B
    - Procurement
    - Catalog
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      STAPLES_API_TOKEN: STAPLES_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: staples
      baseUri: https://api.staplesadvantage.com
      description: "Staples Advantage eProcurement API for B2B office supply ordering"
      authentication:
        type: bearer
        token: "{{STAPLES_API_TOKEN}}"
      resources:
        - name: catalog-search
          path: /v1/catalog/search
          description: Product catalog search
          operations:
            - name: search-products
              method: GET
              description: Search product catalog by keyword
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: true
                  description: Search query string
                - name: category
                  in: query
                  type: string
                  required: false
                  description: Filter by category
                - name: inStock
                  in: query
                  type: boolean
                  required: false
                  description: Filter to in-stock items only
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Maximum results
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: categories
          path: /v1/catalog/categories
          description: Product category hierarchy
          operations:
            - name: list-categories
              method: GET
              description: List product category hierarchy
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: product
          path: /v1/catalog/products/{sku}
          description: Individual product details
          operations:
            - name: get-product
              method: GET
              description: Get product details by SKU
              inputParameters:
                - name: sku
                  in: path
                  type: string
                  required: true
                  description: Product SKU
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: orders
          path: /v1/orders
          description: Order management
          operations:
            - name: list-orders
              method: GET
              description: List order history
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: Filter by order status
                - name: startDate
                  in: query
                  type: string
                  required: false
                  description: Start date filter
                - name: endDate
                  in: query
                  type: string
                  required: false
                  description: End date filter
                - name: costCenter
                  in: query
                  type: string
                  required: false
                  description: Filter by cost center
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-order
              method: POST
              description: Place a new purchase order
              body:
                type: json
                data:
                  items: "{{tools.items}}"
                  deliveryAddress: "{{tools.deliveryAddress}}"
                  purchaseOrderNumber: "{{tools.purchaseOrderNumber}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: order
          path: /v1/orders/{orderId}
          description: Individual order details
          operations:
            - name: get-order
              method: GET
              description: Get order details and status
              inputParameters:
                - name: orderId
                  in: path
                  type: string
                  required: true
                  description: Order identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: account
          path: /v1/account
          description: Account and contract information
          operations:
            - name: get-account
              method: GET
              description: Get account and contract details
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: cost-centers
          path: /v1/account/cost-centers
          description: Cost center management
          operations:
            - name: list-cost-centers
              method: GET
              description: List account cost centers
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: delivery-tracking
          path: /v1/delivery/tracking/{trackingNumber}
          description: Delivery tracking
          operations:
            - name: track-delivery
              method: GET
              description: Track a delivery shipment
              inputParameters:
                - name: trackingNumber
                  in: path
                  type: string
                  required: true
                  description: Carrier tracking number
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: invoices
          path: /v1/invoices
          description: Invoice management
          operations:
            - name: list-invoices
              method: GET
              description: List invoice history
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: Filter by payment status
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: invoice
          path: /v1/invoices/{invoiceId}
          description: Individual invoice details
          operations:
            - name: get-invoice
              method: GET
              description: Get invoice line items and payment status
              inputParameters:
                - name: invoiceId
                  in: path
                  type: string
                  required: true
                  description: Invoice identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8180
      namespace: staples-rest
      resources:
        - path: /v1/catalog/search
          name: catalog-search
          operations:
            - method: GET
              name: search-products
              description: Search product catalog
              call: "staples.search-products"
              with:
                q: "rest.q"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/orders
          name: orders
          operations:
            - method: GET
              name: list-orders
              description: List orders
              call: "staples.list-orders"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-order
              description: Create an order
              call: "staples.create-order"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9180
      namespace: staples-mcp
      transport: http
      tools:
        - name: search-products
          description: Search Staples Advantage product catalog by keyword with category and availability filters
          hints:
            readOnly: true
            idempotent: true
          call: "staples.search-products"
          with:
            q: "tools.q"
            category: "tools.category"
            inStock: "tools.inStock"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-account
          description: Get Staples Advantage account details including contract number, credit limit, and payment terms
          hints:
            readOnly: true
            idempotent: true
          call: "staples.get-account"
          outputParameters:
            - type: object
              mapping: "$."
